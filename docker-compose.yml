services:
  bot:
    build: .
    container_name: sahamku-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Jakarta
      DB_PATH: /data/sahamku.db
      CHARTS_DIR: /data/charts
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

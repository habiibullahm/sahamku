[project]
name = "sahamku"
version = "0.1.0"
description = "Telegram bot: daily AI scan saham liquid IDX"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "aiogram>=3.13",
    "apscheduler>=3.10,<4",
    "mplfinance>=0.12.10b0",
    "anthropic>=1.0",
    "groq>=0.30",
    "feedparser>=6.0",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sahamku*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
